<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>DroperOG — Airdrop Hunter</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="https://img.icons8.com/fluency/48/parachute.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1><span>🪂</span> DroperOG</h1>
        <div class="sub">Multi-Source Airdrop Hunter</div>
      </div>
      <div style="text-align:right">
        <div id="count" style="font-size:13px;color:#94a3b8">Loading...</div>
        <div id="avg-opp" style="font-size:11px;color:#64748b"></div>
      </div>
    </header>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search projects...">
    </div>

    <div class="section-label">Status</div>
    <div class="toolbar">
      <button class="chip view-btn active" data-view="all" onclick="setView('all')">📋 All</button>
      <button class="chip view-btn" data-view="new" onclick="setView('new')">🆕 New (3d)</button>
      <button class="chip status-btn" data-status="potential" onclick="filterByStatus('potential')">💎 Potential</button>
      <button class="chip status-btn" data-status="confirmed" onclick="filterByStatus('confirmed')">✅ Confirmed</button>
      <button class="chip status-btn" data-status="active" onclick="filterByStatus('active')">🟢 Active</button>
      <button class="chip status-btn" data-status="upcoming" onclick="filterByStatus('upcoming')">🆕 Upcoming</button>
      <button class="chip status-btn" data-status="ended" onclick="filterByStatus('ended')">🔴 Ended</button>
    </div>

    <div class="section-label">Chain</div>
    <div class="toolbar">
      <button class="chip chain-btn active" data-chain="all" onclick="filterByChain('all')">🌐 All</button>
      <button class="chip chain-btn" data-chain="ethereum" onclick="filterByChain('ethereum')">⟠ ETH</button>
      <button class="chip chain-btn" data-chain="solana" onclick="filterByChain('solana')">◎ SOL</button>
      <button class="chip chain-btn" data-chain="base" onclick="filterByChain('base')">🔵 Base</button>
      <button class="chip chain-btn" data-chain="arbitrum" onclick="filterByChain('arbitrum')">🔴 Arb</button>
      <button class="chip chain-btn" data-chain="optimism" onclick="filterByChain('optimism')">🟠 OP</button>
      <button class="chip chain-btn" data-chain="polygon" onclick="filterByChain('polygon')">🟣 MATIC</button>
      <button class="chip chain-btn" data-chain="zksync" onclick="filterByChain('zksync')">⚡ zkSync</button>
      <button class="chip chain-btn" data-chain="bsc" onclick="filterByChain('bsc')">🟡 BSC</button>
    </div>

    <div class="section-label">Risk Level</div>
    <div class="toolbar">
      <button class="chip risk-btn active" data-risk="all" onclick="filterByRisk('all')">All</button>
      <button class="chip risk-btn" data-risk="low" onclick="filterByRisk('low')">🟢 Low</button>
      <button class="chip risk-btn" data-risk="medium" onclick="filterByRisk('medium')">🟡 Medium</button>
      <button class="chip risk-btn" data-risk="high" onclick="filterByRisk('high')">🟠 High</button>
      <button class="chip risk-btn" data-risk="critical" onclick="filterByRisk('critical')">🔴 Critical</button>
    </div>

    <div class="section-label">Sort By</div>
    <div class="toolbar">
      <button class="chip sort-btn active" data-sort="opportunity" onclick="setSort('opportunity')">🎯 Opportunity</button>
      <button class="chip sort-btn" data-sort="newest" onclick="setSort('newest')">🕐 Newest</button>
      <button class="chip sort-btn" data-sort="trust" onclick="setSort('trust')">✅ Trust</button>
      <button class="chip sort-btn" data-sort="value" onclick="setSort('value')">💰 Est. Value</button>
      <button class="chip sort-btn" data-sort="vph" onclick="setSort('vph')">⚡ $/hr</button>
      <button class="chip sort-btn" data-sort="urgency" onclick="setSort('urgency')">⏰ Urgency</button>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      Scanning sources...
    </div>

    <div id="project-list"></div>

    <footer>
      🪂 <a href="https://github.com/Misagh95/droperog" target="_blank">DroperOG</a> &mdash; Updated <span id="last-update">just now</span>
    </footer>
  </div>
<script src="app.js"></script>
</body>
</html>
