<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>DroperOG — Airdrop Hunter</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="https://img.icons8.com/fluency/48/parachute.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🪂 DroperOG</h1>
        <div class="sub">Airdrop Hunter</div>
      </div>
      <div class="header-stats">
        <div><span id="count">—</span> tracked</div>
        <div id="avg-opp"></div>
      </div>
    </header>

    <div class="controls">
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Search name or symbol..." autocomplete="off">
      </div>
      <select id="sort-select">
        <option value="opportunity">🎯 Opportunity</option>
        <option value="newest">🕐 Newest</option>
        <option value="trust">✅ Trust</option>
        <option value="value">💰 Value</option>
        <option value="urgency">⏰ Urgency</option>
      </select>
      <select id="status-select">
        <option value="all">📋 All</option>
        <option value="new">🆕 New</option>
        <option value="potential">💎 Potential</option>
        <option value="confirmed">✅ Confirmed</option>
        <option value="active">🟢 Active</option>
        <option value="upcoming">Upcoming</option>
        <option value="ended">🔴 Ended</option>
      </select>
      <select id="risk-select">
        <option value="all">All Risk</option>
        <option value="low">🟢 Low</option>
        <option value="medium">🟡 Medium</option>
        <option value="high">🟠 High</option>
        <option value="critical">🔴 Critical</option>
      </select>
    </div>

    <div id="loading">
      <div class="spinner"></div>
      Loading...
    </div>

    <div id="project-list"></div>

    <footer>
      🪂 <a href="https://github.com/Misagh95/droperog" target="_blank">DroperOG</a>
      &mdash; <span id="last-update">—</span>
    </footer>
  </div>
<script src="app.js"></script>
</body>
</html>
