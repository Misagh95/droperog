name: Scan Airdrops

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  # از اجرای هم‌زمان scan و hunter جلوگیری می‌کند تا git push هر دو با هم race نشود
  group: droperog-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scanner
        run: python droperog.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit scan state + Pages JSON
        run: |
          git config user.name "droperog-bot"
          git config user.email "bot@droperog.app"
          git add data/state.json data/last_report.txt docs/projects.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-update scan results [skip ci]"
            # اگر اسکن دیگری هم‌زمان push کرده باشد، rebase می‌کنیم و دوباره تلاش می‌کنیم
            for i in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              echo "Push failed (attempt $i), retrying..."
              sleep 5
            done
            exit 1
          fi
