name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # telethon هم نصب می‌شود تا مسیرهای واقعی grabber هم import/تست شوند
      - run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -q
